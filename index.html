<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eye Animation</title>

<style>
body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#efe9dd;
}

canvas{
    background:#efe9dd;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let mouse = {
    x: canvas.width/2,
    y: canvas.height/2
};

window.addEventListener("mousemove",(e)=>{
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});

function drawEye(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    let cx = canvas.width/2;
    let cy = canvas.height/2;

    // Eye
    ctx.beginPath();
    ctx.ellipse(cx,cy,180,80,0,0,Math.PI*2);
    ctx.lineWidth=4;
    ctx.stroke();

    // Iris follows mouse
    let dx = mouse.x-cx;
    let dy = mouse.y-cy;

    let angle = Math.atan2(dy,dx);

    let px = cx + Math.cos(angle)*40;
    let py = cy + Math.sin(angle)*20;

    ctx.beginPath();
    ctx.arc(px,py,25,0,Math.PI*2);
    ctx.fill();

    requestAnimationFrame(drawEye);
}

drawEye();
</script>

</body>
</html>
